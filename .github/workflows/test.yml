name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.12'

    - name: Check uv.lock is up to date
      run: uv lock --check

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Ruff lint
      run: uv run ruff check .

    - name: Ruff format
      run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t is the free-threaded build that .python-version pins locally. With the locked pandas, importing
        # pandas switches the GIL back on, so this cell checks the free-threaded interpreter, not GIL-free running.
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t', '3.15']
        include:
          # uv.lock has no 3.15 wheels (numpy, pandas, pyarrow, scipy and scikit-learn stop at cp314), so this cell
          # resolves the newest versions instead of the locked ones. Drop the flag once the lock has 3.15 wheels.
          - python-version: '3.15'
            newest-dependencies: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      if: ${{ !matrix.newest-dependencies }}
      run: uv sync --locked --extra dev

    - name: Install the newest dependencies (uv.lock has no wheels for this Python)
      if: ${{ matrix.newest-dependencies }}
      run: |
        uv lock --upgrade
        uv sync --extra dev

    - name: Check that no extra is installed (this is the core-only job)
      run: uv run python -c "import importlib.util, sys; sys.exit(any(importlib.util.find_spec(m) is not None for m in ('numba', 'torch', 'lightgbm', 'xgboost', 'catboost', 'optuna', 'tabpfn', 'tabicl')))"

    - name: Run tests
      env:
        ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      run: |
        uv run pytest -m "not integration" -n auto --dist worksteal --cov=epftoolbox2 --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  fast-extra:
    # The [fast] extra (numba): the numba twins of the LEAR kernels against the numpy reference
    # (tests/models/test_lars_kernels.py), and the rest of the suite with numba installed. The test job above installs no
    # extra, so there the numpy kernels run alone and the numba tests skip.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14t']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with the fast extra
      run: uv sync --locked --extra dev --extra fast

    - name: Check that numba imports (the numba tests would skip without it)
      run: uv run python -c "import numba; print('numba', numba.__version__)"

    - name: Run tests
      run: uv run pytest -m "not integration" -n auto --dist worksteal -q

  torch-extra:
    # The [torch] extra (torch from PyTorch's CPU index, as uv.lock has it): the torch core's tests
    # (tests/models/test_torch_core.py: nets, the trainer's bitwise claims at 1, 2 and 4 threads, the TF32 and thread scope,
    # thread pinning in the pool initialiser, the fine-tune helper), and the rest of the suite with torch installed, whose
    # docs blocks importing epftoolbox2.nets the core-only job can't check. The test job above installs no extra, so there
    # these tests skip. 3.14t is the free-threaded build (torch has cp314t wheels).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14t']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with the torch extra (and tune, for the search's torch test)
      run: uv sync --locked --extra dev --extra torch --extra tune

    - name: Check that torch imports and is the CPU build (the torch tests would skip without it)
      run: uv run python -c "import torch; print('torch', torch.__version__); assert not torch.backends.cuda.is_built()"

    - name: Run tests
      run: uv run pytest -m "not integration" -n auto --dist worksteal -q

  gbm-extra:
    # The tree extras [lightgbm], [xgboost] and [catboost]: the tree families' tests with the real packages
    # (tests/models/test_gbm.py: fits by hand, the adapter suite, threads and versions compared on resume, as residual
    # learners) and their golden numbers (tests/golden/gbm_metrics.json, written with the lock's versions), and the rest of
    # the suite with the packages installed. The test job above installs no extra, so there these tests skip. 3.14t is the
    # free-threaded build: catboost has no wheels for it, so that cell installs the other two.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            extras: '--extra lightgbm --extra xgboost --extra catboost'
            modules: "'lightgbm', 'xgboost', 'catboost'"
          - python-version: '3.14t'
            extras: '--extra lightgbm --extra xgboost'
            modules: "'lightgbm', 'xgboost'"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with the tree extras
      run: uv sync --locked --extra dev ${{ matrix.extras }}

    - name: Check that the packages import (their tests would skip without them)
      run: uv run python -c "import importlib, importlib.metadata as m; [print(n, m.version(n), importlib.import_module(n).__name__) for n in (${{ matrix.modules }})]"

    - name: Run tests
      run: uv run pytest -m "not integration" -n auto --dist worksteal -q

  families-extra:
    # The pretrained families' extras, packages installed and no weights: the in-context models [tabpfn] and [tabicl]
    # (tests/models/test_in_context.py: the real regressors around a fake fit/predict, their settings, the TabPFN version guard,
    # one checkpoint read per process; the adapter suite), the foundation models [t0] and [chronos] (tests/models/test_t0.py,
    # test_chronos.py: the real backends around package-level fakes), and the rest of the suite with the packages installed.
    # The test job above installs no extra, so there these tests skip. The free-threaded cell installs [tabicl] alone: tabpfn,
    # t0 and chronos need safetensors, which has no free-threaded wheels. No job has weights or a GPU (`-m weights` runs where
    # EPFTOOLBOX2_WEIGHTS_DIR holds them).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            extras: '--extra tabpfn --extra tabicl --extra t0 --extra chronos'
            modules: "'tabpfn', 'tabicl', 't0', 'chronos', 'torch'"
          - python-version: '3.13'
            extras: '--extra tabpfn --extra tabicl --extra t0 --extra chronos'
            modules: "'tabpfn', 'tabicl', 't0', 'chronos', 'torch'"
          - python-version: '3.14t'
            extras: '--extra tabicl'
            modules: "'tabicl', 'torch'"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with the families' extras
      run: uv sync --locked --extra dev ${{ matrix.extras }}

    - name: Check that the packages import (their tests would skip without them)
      run: uv run python -c "import importlib, importlib.metadata as m; d = m.packages_distributions(); [print(n, m.version(d.get(n, [n])[0]), importlib.import_module(n).__name__) for n in (${{ matrix.modules }})]"

    - name: Run tests
      run: uv run pytest -m "not integration" -n auto --dist worksteal -q

  tune-extra:
    # The [tune] extra (Optuna): tune.BayesSearch's tests (tests/test_tune.py: the cut before the first trial, the same table
    # twice with one worker, successive halving's promotions, two worker processes on one journal through `epf tune`,
    # requeue, warm starts, best() and its provenance) and validation_every's. Optuna changes nothing else, so the rest of
    # the suite runs in the other jobs; the torch job installs it too for the search's torch test. 3.14t is free-threaded.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14t']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with the tune extra
      run: uv sync --locked --extra dev --extra tune

    - name: Check that optuna imports (the tune tests would skip without it)
      run: uv run python -c "import optuna; print('optuna', optuna.__version__)"

    - name: Run the search's tests
      run: uv run pytest tests/test_tune.py tests/pipelines/test_validation_every.py -n auto --dist worksteal -q

  newest-dependencies:
    # The other jobs install the versions in uv.lock, so a release that breaks the library (pandas 3.1 did)
    # stays invisible until someone upgrades. This job resolves the newest versions on every run; the upgraded
    # lock is not committed. It installs the tree extras too (3.14 with the GIL has wheels of all three), so a new
    # LightGBM, XGBoost or CatBoost release that breaks a tree model shows here (their golden numbers, pinned to the
    # lock's releases, skip by name), and Optuna (the [tune] extra), whose storage and sampler APIs the search uses.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv with Python 3.14
      uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.14'

    - name: Resolve the newest dependencies
      run: uv lock --upgrade

    - name: Install dependencies
      run: uv sync --extra dev --extra lightgbm --extra xgboost --extra catboost --extra tune

    - name: Show the installed versions
      run: uv pip list

    - name: Run tests
      run: uv run pytest -m "not integration" -q -n auto --dist worksteal
