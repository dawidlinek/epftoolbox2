models:
- class: OLSModel
  params:
    predictors: &id001
    - load_actual
    - is_monday_d+{horizon}
    - is_tuesday_d+{horizon}
    - is_wednesday_d+{horizon}
    - is_thursday_d+{horizon}
    - is_friday_d+{horizon}
    - is_saturday_d+{horizon}
    - is_sunday_d+{horizon}
    - is_holiday_d+{horizon}
    - daylight_hours_d+{horizon}
    - load_actual_d-1
    - load_actual_d-2
    - price_d-1
    - price_d-2
    - warsaw_temperature_2m_d+{horizon}
    training_window: 365
    name: OLS
- class: LassoCVModel
  params:
    predictors: *id001
    training_window: 365
    name: LassoCV
    cv: 5
    max_iter: 10000
evaluators:
- class: MAEEvaluator
  params: {}
- class: RMSEEvaluator
  params: {}
exporters:
- class: TerminalExporter
  params:
    show:
    - summary
    - horizon
- class: ExcelExporter
  params:
    path: workflow_results.xlsx
    sheets:
    - summary
    - hour
    - horizon
    - hour_horizon
    - year
    - year_horizon
    - run_weekday_horizon
    - target_weekday_horizon
    - details
