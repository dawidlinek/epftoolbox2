[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epftoolbox2"
version = "2.3.0"
description = "Energy Price Forecasting Toolbox 2"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Dawid Linek", email = "dawid@linek.dev"}
]
keywords = ["energy", "forecasting", "toolbox", "machine learning", "deep learning", "electricity price"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=2.2.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "holidays>=0.40",
    "astral>=3.2",
    "scikit-learn>=1.3.0",
    "threadpoolctl>=3.1.0",
    "scipy>=1.10.0",
    "openpyxl>=3.1.0",
    "questionary>=2.0.0",
    "pyarrow>=15.0.0",
    "filelock>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/dawidlinek/epftoolbox2"
Documentation = "https://dawidlinek.github.io/epftoolbox2"
Repository = "https://github.com/dawidlinek/epftoolbox2"
Issues = "https://github.com/dawidlinek/epftoolbox2/issues"

[project.optional-dependencies]
# numba twins of the LEAR kernels (epftoolbox2/models/_lars_numba.py); the numpy ones always exist. numba 0.65 is the first
# with free-threaded (3.14t) wheels. 3.15 is left out: numba 0.68.1 has cp315 wheels but none for 3.15t, and a marker can't
# tell the two apart.
fast = [
    "numba>=0.65; python_version < '3.15'",
]
# torch for the neural-network families and their trainer (epftoolbox2/nets.py, epftoolbox2/models/_torch/). uv.lock takes it
# from PyTorch's CPU index (below): a 200 MB wheel instead of PyPI's CUDA build, which also fails on older GPUs. For a CUDA
# install see the docs (models/neural-networks).
torch = [
    "torch>=2.9",
]
# The gradient-boosted tree families (epftoolbox2/models/gbm.py), one extra per package, so each class's pre-flight asks for its
# own: LightGBMModel, XGBoostModel, CatBoostModel; `gbm` installs the first two. XGBoost's Linux wheel depends on NVIDIA's
# NCCL (about 300 MB, used only by multi-GPU training), and its releases from 3.3 need Python 3.12 (3.11 gets 3.2).
lightgbm = [
    "lightgbm>=4.5",
]
xgboost = [
    "xgboost>=2.1",
]
# catboost has no 3.15 and no free-threaded (3.14t) wheels; a marker can't tell 3.14t from 3.14, so CI never installs it there.
catboost = [
    "catboost>=1.2.9; python_version < '3.15'",
]
gbm = [
    "epftoolbox2[lightgbm,xgboost]",
]
# Optuna for the Bayesian search with successive halving (epftoolbox2/tune/): its samplers and its journal storage, which
# parallel workers (`epf tune --workers N`, a SLURM array) share. Optuna 4 named the journal file backend.
tune = [
    "optuna>=4,<5",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
epf = "epftoolbox2.cli:main"

# torch comes from PyTorch's CPU index; `explicit` keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.hatch.build.targets.wheel]
packages = ["epftoolbox2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# A parallel fast-suite run leaves about 44k files under the system temp dir; /tmp on a tmpfs runs out of inodes after a
# few dozen runs. Keep only the directories of failed tests, and of the last run only.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "integration: Integration tests that require real API keys and use real connections",
    "examples: Runs examples/*.py and the documentation quick start against the live APIs (also marked integration)",
    "gpu: Needs a CUDA GPU (also marked integration, so the fast suite never runs it)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
