timezone: Europe/Warsaw
on_invalid: warn
sources:
- class: EntsoeSource
  params:
    country_code: PL
    api_key: ${ENTSOE_API_KEY}
    type:
    - load
    - price
    prefer_15min: false
    neighbours: null
    prefix: ''
- class: OpenMeteoSource
  params:
    latitude: 52.2297
    longitude: 21.0122
    locations: null
    agg: null
    keep_locations: false
    columns:
    - temperature_2m
    - rain
    - showers
    - snowfall
    - relative_humidity_2m
    - dew_point_2m
    - apparent_temperature
    - precipitation
    - weather_code
    - surface_pressure
    - pressure_msl
    - cloud_cover
    - wind_speed_10m
    - wind_direction_10m
    horizon: 5
    model: jma_seamless
    temporal_resolution: null
    api: previous_runs
    run: '00'
    timezone: null
    prefix: warsaw
    strict: false
    proxy_url: null
- class: CalendarSource
  params:
    country: PL
    timezone: null
    lat: 52.2297
    lon: 21.0122
    holidays: binary
    weekday: onehot
    hour: false
    month: false
    daylight: true
    prefix: ''
    freq: 1h
    region: null
    categories: null
    bridge_days: false
    christmas_period: false
    holiday_distance: 0
    dst_switch: false
    regimes: false
    school_holidays: false
source_validators: []
transformers:
- class: TimezoneTransformer
  params:
    target_tz: null
    daily_columns:
    - load_forecast_daily_min
    - load_forecast_daily_max
    daily_anchor: null
- class: ResampleTransformer
  params:
    freq: 1h
    agg: mean
    fill: ffill
- class: LagTransformer
  params:
    columns:
    - load_actual
    - price
    lags:
    - 1
    - 2
    - 7
    freq: day
- class: LagTransformer
  params:
    columns:
    - is_monday
    - is_tuesday
    - daylight_hours
    - is_wednesday
    - is_thursday
    - is_friday
    - is_saturday
    - is_sunday
    - is_holiday
    lags:
    - -7
    - -6
    - -5
    - -4
    - -3
    - -2
    - -1
    - 0
    freq: day
- class: LagTransformer
  params:
    columns:
    - load_forecast
    lags:
    - -1
    freq: day
validators:
- class: CoverageValidator
  params:
    columns:
    - load_actual
    - price
    start: null
    end: null
    freq: null
    min_coverage: 1.0
    max_gap: null
