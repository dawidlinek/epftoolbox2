sources:
- class: EntsoeSource
  params:
    country_code: PL
    api_key: YOUR_API_KEY_HERE
    type:
    - load
    - price
    prefer_15min: false
- class: OpenMeteoSource
  params:
    latitude: 52.2297
    longitude: 21.0122
    horizon: 7
    model: jma_seamless
    columns:
    - temperature_2m
    - rain
    - showers
    - snowfall
    - relative_humidity_2m
    - dew_point_2m
    - apparent_temperature
    - precipitation
    - weather_code
    - surface_pressure
    - pressure_msl
    - cloud_cover
    - wind_speed_10m
    - wind_direction_10m
    prefix: warsaw
    proxy_url: null
- class: CalendarSource
  params:
    country: PL
    timezone: Europe/Warsaw
    holidays: binary
    weekday: onehot
    hour: false
    month: false
    daylight: true
    prefix: ''
    freq: 1h
transformers:
- class: TimezoneTransformer
  params:
    target_tz: Europe/Warsaw
    daily_columns:
    - load_forecast_daily_min
    - load_forecast_daily_max
- class: ResampleTransformer
  params:
    freq: 1h
    method: linear
    columns: null
- class: LagTransformer
  params:
    columns:
    - load_actual
    - price
    lags:
    - 1
    - 2
    - 7
    freq: day
- class: LagTransformer
  params:
    columns:
    - is_monday
    - is_tuesday
    - daylight_hours
    - is_wednesday
    - is_thursday
    - is_friday
    - is_saturday
    - is_sunday
    - load_forecast
    - is_holiday
    lags:
    - -7
    - -6
    - -5
    - -4
    - -3
    - -2
    - -1
    - 0
    freq: day
validators:
- class: NullCheckValidator
  params:
    columns:
    - load_actual
    - price
    allow_nulls: false
